[project]
name = "kk_mod_manager"
# 版本号单一来源在 app/__init__.py 的 __version__；发布时需同步更新此处
version = "0.1.0"
description = "KK Mod Manager - Illusion 系列游戏桌面端 Mod 管理工具"
requires-python = ">=3.11"
dependencies = [
    "PyQt6>=6.5.0",
    "SQLAlchemy>=2.0",
    "pydantic>=2.0",
    "loguru>=0.7",
    "packaging",
    "Pillow>=10.0",
]

[project.scripts]
kk-mod-manager = "main:main"

[build-system]
requires = ["setuptools>=69.0"]
build-backend = "setuptools.build_meta"

[tool.pytest.ini_options]
testpaths = ["tests"]
# 只收集 test_*.py：默认模式含 *_test.py，会把手动脚本
# sync_service_test.py / card_service_test.py / scene_service_test.py 收进来
python_files = ["test_*.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]
pythonpath = ["."]
addopts = "-ra"
